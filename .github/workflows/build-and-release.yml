name: Build and release QGIS plugin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Test and build installable ZIP
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      qgis-runtimes: ${{ steps.runtimes.outputs.matrix }}
      qgis-base-url: ${{ steps.runtimes.outputs.base-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read shared QGIS runtime pins
        id: runtimes
        run: |
          $manifest = Get-Content scripts/qgis-runtimes.json -Raw | ConvertFrom-Json
          $matrix = ConvertTo-Json -InputObject @($manifest.runtimes) -Depth 10 -Compress
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          "base-url=$($manifest.base_url)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test build tooling and repository consistency
        run: python -m unittest discover -s scripts/tests -v
      - name: Test plugin and bilingual resources
        run: python -m unittest discover -s qgis_plugin/tests -v
      - name: Build plugin
        run: ./qgis_plugin/package.ps1
      - name: Test extracted plugin
        run: |
          $archive = Get-ChildItem qgis_plugin/dist/*.zip
          if (@($archive).Count -ne 1) { throw 'Expected one plugin ZIP' }
          $env:RESPONSIBLE_FOREST_PLANNING_TEST_PLUGIN_ROOT = Join-Path $env:RUNNER_TEMP 'installed-plugin'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $env:RESPONSIBLE_FOREST_PLANNING_TEST_PLUGIN_ROOT
          python -m unittest discover -s qgis_plugin/tests -v
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: qgis-plugin-build
          path: qgis_plugin/dist/*.zip
          if-no-files-found: error

  quality:
    name: Pylint and QGIS ${{ matrix.qgis.version }} integration
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        qgis: ${{ fromJSON(needs.build.outputs.qgis-runtimes) }}
    env:
      QGIS_PYTHON: C:\Program Files\QGIS ${{ matrix.qgis.version }}\bin\${{ matrix.qgis.launcher }}
      QGIS_INSTALLER_NAME: ${{ matrix.qgis.installer }}
      QGIS_INSTALLER_SHA256: ${{ matrix.qgis.sha256 }}
      QGIS_INSTALLER_BASE_URL: ${{ needs.build.outputs.qgis-base-url }}
      QGIS_VERSION_INT: ${{ matrix.qgis.version_int }}
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache verified QGIS installer
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/${{ env.QGIS_INSTALLER_NAME }}
          key: ${{ runner.os }}-qgis-installer-${{ env.QGIS_INSTALLER_SHA256 }}
      - name: Install QGIS ${{ matrix.qgis.version }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP $env:QGIS_INSTALLER_NAME
          $baseUrl = $env:QGIS_INSTALLER_BASE_URL
          if (-not (Test-Path -LiteralPath $installer)) {
            Invoke-WebRequest "$baseUrl/$env:QGIS_INSTALLER_NAME" -OutFile $installer -MaximumRetryCount 3
          }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $env:QGIS_INSTALLER_SHA256) {
            throw 'QGIS installer checksum mismatch'
          }
          $installLog = Join-Path $env:RUNNER_TEMP 'qgis-install.log'
          $install = Start-Process msiexec.exe -Wait -PassThru -WindowStyle Hidden -ArgumentList @(
            '/i', "`"$installer`"", '/qn', '/norestart', '/L*v', "`"$installLog`""
          )
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "QGIS installation failed with exit code $($install.ExitCode); see qgis-install.log"
          }
          if (-not (Test-Path -LiteralPath $env:QGIS_PYTHON)) {
            throw "QGIS Python launcher missing: $env:QGIS_PYTHON"
          }
      - name: Verify QGIS runtime
        run: |
          & $env:QGIS_PYTHON -c "import os; from qgis.core import Qgis; print(Qgis.QGIS_VERSION); assert Qgis.QGIS_VERSION_INT == int(os.environ['QGIS_VERSION_INT'])"
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected QGIS runtime version' }
      - name: Install development dependencies
        run: |
          & $env:QGIS_PYTHON -m pip install --user -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not install development dependencies' }
      - name: Lint Python
        run: |
          & $env:QGIS_PYTHON -m pylint qgis_plugin scripts
          if ($LASTEXITCODE -ne 0) { throw 'Pylint failed' }
      - name: Test QGIS integration against source
        run: |
          & $env:QGIS_PYTHON scripts/run_qgis_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Source QGIS integration tests failed' }
      - uses: actions/download-artifact@v8
        with:
          name: qgis-plugin-build
          path: qgis_plugin/dist
      - name: Test QGIS integration against built ZIP
        run: |
          $archive = Get-ChildItem qgis_plugin/dist/*.zip
          if (@($archive).Count -ne 1) { throw 'Expected one plugin ZIP' }
          $env:RESPONSIBLE_FOREST_PLANNING_TEST_PLUGIN_ROOT = Join-Path $env:RUNNER_TEMP 'qgis-installed-plugin'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $env:RESPONSIBLE_FOREST_PLANNING_TEST_PLUGIN_ROOT
          & $env:QGIS_PYTHON scripts/run_qgis_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged QGIS integration tests failed' }
      - name: Upload QGIS installation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qgis-install-diagnostics-${{ matrix.qgis.version }}
          path: ${{ runner.temp }}/qgis-install.log
          if-no-files-found: ignore

  release:
    name: Publish minor release
    needs: [build, quality]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: qgis-plugin-release
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Release the exact tested source, even if main has moved meanwhile.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare minor version or recover existing release
        id: version
        run: python scripts/prepare_release.py
      - name: Build release ZIP
        run: ./qgis_plugin/package.ps1
      - name: Test extracted release
        run: |
          $archive = Get-ChildItem qgis_plugin/dist/*.zip
          if (@($archive).Count -ne 1) { throw 'Expected one release ZIP' }
          $env:RESPONSIBLE_FOREST_PLANNING_TEST_PLUGIN_ROOT = Join-Path $env:RUNNER_TEMP 'release-plugin'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $env:RESPONSIBLE_FOREST_PLANNING_TEST_PLUGIN_ROOT
          python -m unittest discover -s qgis_plugin/tests -v
      - name: Tag versioned release commit
        if: steps.version.outputs.existing != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qgis_plugin/savonia_responsible_forest_planning_tool/metadata.txt
          git commit -m "Release $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit release metadata' }
          git tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Could not create release tag' }
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push release tag' }
      - name: Publish downloadable release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path 'qgis_plugin/dist' "savonia_responsible_forest_planning_tool-$env:RELEASE_VERSION.zip"
          $release = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($release | ConvertFrom-Json).isDraft) {
              Write-Output "Release $env:RELEASE_TAG is already published."
              exit 0
            }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --generate-notes --title "Savonia - Responsible Forest Planning $env:RELEASE_VERSION"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          }
          gh release upload $env:RELEASE_TAG $archive --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach plugin ZIP' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
